# conda env create -f environment.yml   (the easiest way to get GDAL/rasterio working on Windows)
name: rs-tools
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - rasterio>=1.3
  - pyproj
  - shapely>=2
  - geopandas
  - pyarrow
  - matplotlib
  - requests
  - h5py
  - fsspec
  - zarr<3
  - aiohttp
  - earthaccess
  - pip
  - pip:
      - mcp>=1.10
      - climate-indices>=2.3
